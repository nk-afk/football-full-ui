<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian · Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --color-primary:#2B7FFF; --color-primary-text:#027BFC; --color-primary-hover:#1C6EF0;
  --color-primary-soft:#EBF3FF; --color-primary-tint:#EBF3FF; --color-primary-border:#B4D1FF; --color-primary-ink:#027BFC;
  --color-page:#F6F8FA; --color-surface:#FFFFFF; --color-surface-subtle:#F9FAFB; --color-surface-muted:#F1F5F9;
  --color-border:#E5E7EB; --color-border-subtle:#EEF2F6; --color-separator:#E6EAF0;
  --color-text:#111827; --color-text-muted:#4B5563; --color-text-soft:#6B7280; --color-text-disabled:#9CA3AF;
  --r-sm:6px; --r-md:10px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  --shadow-card:0 1px 2px rgba(15,23,42,.04); --shadow-pop:0 16px 40px rgba(15,23,42,.18);
  --ff:"Inter Display","Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --side:240px; --top:52px; --rail:360px;
  --rail-inset:28px;
  --c-plan:#5CA423; --c-plan-soft:#EFFAE6;
  --c-partial:#E58600; --c-partial-soft:#FFEED6;
  --c-review:#E50C00; --c-review-soft:#FFE7E5;
  --c-notobs:#9CA3AF; --c-notobs-soft:#EEF1F4;
  --c-now:#EF4444; --hourpx:58px; --gridh:522px;
}
*{margin:0;padding:0;box-sizing:border-box;corner-shape:squircle}
.avatar,.pnum,.cal-date.today,.rc-ava,.rc-play .pc{corner-shape:round}
body{font-family:var(--ff);background:var(--color-page);color:var(--color-text);-webkit-font-smoothing:antialiased}
.eyebrow{font-size:11px;line-height:14px;font-weight:400;letter-spacing:.09em;text-transform:uppercase;color:var(--color-text-soft)}
a{color:inherit;text-decoration:none}
button{font-family:var(--ff)}

/* ---------- app shell ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--color-surface);border-bottom:1px solid var(--color-separator);display:flex;align-items:center;gap:14px;padding:0 24px 0 20px;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.02em}
.brandlogo{height:22px;width:auto;display:block;color:var(--color-text)}
.topbar .sp{flex:1}
.topclub{color:var(--color-text-soft);font-weight:600;font-size:13px;padding-right:14px;margin-right:2px;border-right:1px solid var(--color-separator)}
.btn{font-size:13px;font-weight:600;border-radius:var(--r-lg);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.btn:hover{background:var(--color-surface-subtle)}
.btn svg{width:16px;height:16px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.navtoggle{width:34px;height:34px;border-radius:var(--r-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-soft);display:grid;place-items:center;cursor:pointer;flex:none}
.navtoggle:hover{background:var(--color-surface-subtle);color:var(--color-text)}
.navtoggle svg{width:18px;height:18px}
.side{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);background:var(--color-surface);border-right:1px solid var(--color-separator);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto;z-index:30;transition:width .2s ease}
.side .grp{margin:14px 8px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);border:1px solid transparent;color:var(--color-text-soft);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;position:relative}
.nav svg{width:18px;height:18px;color:var(--color-text-soft)}
.nav:hover{background:var(--color-surface-subtle)}
.nav.disabled{cursor:default;pointer-events:none}
.nav.active{background:var(--color-surface-muted);border-color:rgba(31,43,39,.03);color:var(--color-text);font-weight:600}
.nav.active svg{color:var(--color-text)}
.nav .badge{margin-left:auto;background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;border-radius:var(--r-pill);padding:1px 8px}
.side-foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.sidecta{width:100%;justify-content:center;background:var(--color-primary-tint);border-color:var(--color-primary-text);color:var(--color-primary-text);font-weight:700}
.sidecta:hover{background:#DCEAFF}
.profile{display:flex;align-items:center;gap:10px;padding:2px}
.profile .pname{font-size:13px;font-weight:600;color:var(--color-text)}
body.nav-collapsed{--side:64px}
body.nav-collapsed .side{padding:16px 8px}
body.nav-collapsed .side .grp{display:none}
body.nav-collapsed .nav{justify-content:center;padding:9px 0;gap:0}
body.nav-collapsed .nav .lbl{display:none}
body.nav-collapsed .nav .badge{position:absolute;top:1px;right:9px;margin:0}
body.nav-collapsed .side-foot{align-items:center}
body.nav-collapsed .sidecta{width:36px;padding:0}
body.nav-collapsed .sidecta .lbl{display:none}
body.nav-collapsed .profile .pname{display:none}
.main{margin-left:var(--side);margin-top:var(--top);transition:margin-left .2s ease;padding-bottom:70px}

/* ---------- home layout ---------- */
.home{max-width:1420px;margin:0 auto;padding:22px 28px 0}
.home-main{min-width:0}
.home-rail{margin-top:54px}

.h-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.h-left{display:flex;align-items:stretch;gap:22px;flex-wrap:wrap}
.h-title{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.02em;color:var(--color-text)}
.h-sub{font-size:15px;color:var(--color-text-muted);margin-top:6px}
.h-now{display:flex;align-items:center;gap:10px;border-left:1px solid var(--color-separator);padding-left:22px;align-self:center}
.h-now-dot{width:9px;height:9px;border-radius:50%;background:var(--c-now);flex:none}
.h-now-time{font-size:15px;font-weight:700;color:var(--color-text);font-variant-numeric:tabular-nums;line-height:1.15}
.h-now-lbl{font-size:12px;color:var(--color-text-soft)}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:22px 0 14px}
.sec-title{font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.01em}
.sec-aux{font-size:13px;color:var(--color-text-soft)}

/* today cards */
.today-grid{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:16px}
.tc-viewport{overflow:hidden;border-radius:var(--r-lg)}
.tc-track{display:flex;align-items:stretch;transition:transform .32s ease}
.tc-track .acard{flex:0 0 100%;min-width:0}
.tc-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
.tc-arrow{width:34px;height:34px;border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--r-md);display:grid;place-items:center;cursor:pointer;color:var(--color-text-soft)}
.tc-arrow:hover{background:var(--color-surface-subtle);color:var(--color-text)}
.tc-arrow:disabled{opacity:.4;cursor:default}
.tc-arrow:disabled:hover{background:var(--color-surface);color:var(--color-text-soft)}
.tc-arrow svg{width:17px;height:17px}
.tc-dots{display:flex;align-items:center;gap:7px}
.tc-dot{width:7px;height:7px;border-radius:999px;background:var(--color-border);cursor:pointer;border:0;padding:0;transition:width .2s,background .2s}
.tc-dot.active{background:var(--color-primary);width:20px}
.type-tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--color-text-soft);font-weight:500}
.type-tag .ti{display:inline-flex}
.type-tag .ti svg{width:17px;height:17px}
.acard{position:relative;background:var(--color-surface);border:none;border-radius:var(--r-lg);cursor:pointer;box-shadow:var(--shadow-card);transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column;overflow:hidden}
.acard:hover{border-color:var(--color-primary-border);box-shadow:0 2px 10px rgba(15,23,42,.06)}
.acard.next{border-color:var(--color-primary)}
.ac-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px 0}
.ac-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px 0}
.ac-type{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:var(--r-pill);color:var(--color-text-soft);background:var(--color-surface-subtle)}
.ac-type svg{width:15px;height:15px}
.ac-time{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--color-text-soft);margin-top:7px;font-variant-numeric:tabular-nums}
.ac-time svg{width:15px;height:15px;flex:none}
.ac-time .dash{color:var(--color-text-soft);margin:0 2px}
.ac-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
.ac-badge svg{width:17px;height:17px}
.ac-badge.done{color:var(--c-plan)}
.ac-badge.next{color:var(--color-primary-text)}
.ac-dot{position:relative;width:8px;height:8px;border-radius:50%;corner-shape:round;background:var(--color-primary);flex:none}
.ac-dot::before,.ac-dot::after{content:"";position:absolute;inset:0;border-radius:50%;corner-shape:round;background:var(--color-primary);animation:acripple 1.8s ease-out infinite}
.ac-dot::after{animation-delay:.9s}
@keyframes acripple{0%{transform:scale(1);opacity:.4}100%{transform:scale(3);opacity:0}}
.ac-badge.soon{color:var(--color-text-soft)}
.ac-body{padding:12px 18px 0}
.ac-ico{flex:none;width:48px;height:48px;border-radius:12px;background:var(--color-surface-subtle);display:grid;place-items:center;color:var(--color-text-soft)}
.ac-ico svg{width:24px;height:24px}
.ac-info{min-width:0}
.ac-title{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.1;color:var(--color-text)}
.ac-loc{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--color-text-soft);margin-top:6px}
.ac-loc svg{width:15px;height:15px;flex:none}
.ac-foot{margin-top:auto;padding:13px 18px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ac-foot.end{justify-content:flex-end}
.ac-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:var(--r-pill)}
.ac-pill svg{width:15px;height:15px}
.ac-pill.ready{color:var(--c-plan);background:var(--c-plan-soft)}
.ac-pill.vid{color:var(--color-text-soft);background:var(--color-surface-subtle)}
.ac-pill.vid svg{animation:acProcessing 1.3s ease-in-out infinite}
@keyframes acProcessing{0%,100%{opacity:1}50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.ac-pill.vid svg{animation:none}}
.ac-pill.needed{color:var(--c-partial);background:var(--c-partial-soft)}
.ac-link{display:inline-flex;align-items:center;gap:6px;color:var(--color-primary-text);font-size:14px;font-weight:700;white-space:nowrap}
.ac-link svg{width:16px;height:16px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.status svg{width:16px;height:16px}
.status.ready{color:var(--c-plan)}
.status.needed{color:var(--c-partial)}

/* this week */
.week-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:46px 0 14px;flex-wrap:wrap}
.week-sub1{font-size:13px;color:var(--color-text-soft);margin-top:11px}
.week-sub2{font-size:13px;color:var(--color-text-soft);margin-top:11px}
.week-ctrls{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.week-nav{display:flex;align-items:center;gap:8px}
.ibtn{width:38px;height:38px;border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--r-lg);display:grid;place-items:center;cursor:pointer;color:var(--color-text-soft)}
.ibtn:hover{background:var(--color-surface-subtle);color:var(--color-text)}
.ibtn svg{width:18px;height:18px}
.filters{display:inline-flex;background:var(--color-surface-muted);border-radius:var(--r-md);padding:3px}
.fbtn{border:0;background:none;font-size:12.5px;font-weight:600;color:var(--color-text-soft);padding:6px 16px;border-radius:7px;cursor:pointer;font-family:inherit}
.fbtn:hover{color:var(--color-text)}
.fbtn.active{background:var(--color-surface);color:var(--color-text);box-shadow:var(--shadow-card)}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--color-border);margin-top:12px}
.ptab{border:0;background:none;font-size:13px;font-weight:500;color:var(--color-text-soft);padding:8px 12px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:5px;font-family:inherit}
.ptab:hover{color:var(--color-text)}
.ptab span{color:var(--color-text-soft);font-weight:500;font-size:12px}
.ptab.active{color:var(--color-text);border-bottom-color:var(--color-primary-text);font-weight:600}
.ptab.active span{color:var(--color-text);font-weight:600}

.weekcal{background:var(--color-surface);border:none;border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden}
.wcscroll{overflow-x:auto}
.wc-inner{min-width:900px}
.wc-row{display:grid;grid-template-columns:58px repeat(7,1fr)}
.wc-head{border-bottom:1px solid var(--color-separator)}
.wc-dayh{border-left:1px solid var(--color-separator);display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 10px;text-align:center}
.wc-dow{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--color-text-soft);font-weight:600}
.wc-date{font-size:16px;font-weight:700;color:var(--color-text);line-height:1;font-variant-numeric:tabular-nums;height:30px;display:grid;place-items:center}
.wc-date.today{background:var(--color-primary);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px}
.wc-allday{border-bottom:1px solid var(--color-separator)}
.wc-adl{font-size:11px;color:var(--color-text-soft);padding:0 8px;text-align:right;display:flex;align-items:center;justify-content:flex-end}
.wc-adc{border-left:1px solid var(--color-separator);min-height:38px;display:flex;align-items:center;gap:7px;padding:0 10px;font-size:13px;color:var(--color-text-soft)}
.wc-adc svg{width:18px;height:18px;color:var(--color-text-disabled)}
.wc-body{position:relative;display:grid;grid-template-columns:58px repeat(7,1fr)}
.wc-gutter{position:relative;height:var(--gridh)}
.wc-hr{position:absolute;right:9px;font-size:11px;color:var(--color-text-soft);font-variant-numeric:tabular-nums;line-height:1}
.wc-day{position:relative;height:var(--gridh);border-left:1px solid var(--color-separator);background-image:repeating-linear-gradient(to bottom,var(--color-border-subtle) 0,var(--color-border-subtle) 1px,transparent 1px,transparent var(--hourpx))}
.wc-day.rest{background:none}
.wc-day.rest::before{content:"";position:absolute;top:0;left:6px;right:6px;bottom:0;border-radius:0 0 8px 8px;background-color:var(--color-surface-subtle);background-image:repeating-linear-gradient(45deg,rgba(100,116,139,.22) 0,rgba(100,116,139,.22) 1px,transparent 1px,transparent 8px)}
.wc-dayh.hasadev{padding-bottom:0}
.wc-adev{align-self:stretch;margin:2px 6px 0;background-color:var(--color-surface-subtle);border-radius:8px 8px 0 0;padding:4px 8px 7px;font-size:11.5px;color:var(--color-text-soft);display:flex;align-items:center;justify-content:center;gap:5px;line-height:1.3;overflow:hidden}
.wc-adev svg{width:14px;height:14px;flex:none;color:var(--color-text-disabled)}
.wc-ev{position:absolute;left:5px;right:5px;border-radius:7px 0 0 7px;padding:6px 8px 6px 11px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.05);display:block;min-height:30px;text-decoration:none}
.wc-ev.past{background-image:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5))}
.wc-ev.past::before{opacity:.4}
.wc-ev.past .ev-title{opacity:.5}
.wc-ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ev-accent)}
.wc-ev .ev-title{font-size:12.5px;font-weight:700;color:var(--color-text);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-ev .ev-time{font-size:11px;color:var(--color-text-soft);font-variant-numeric:tabular-nums;margin-top:1px}
.wc-ev .ev-loc{font-size:11px;color:var(--color-text-soft)}
.wc-ev .ev-ic{position:absolute;right:6px;bottom:6px;display:grid;place-items:center}
.wc-ev .ev-ic svg{width:15px;height:15px;display:block}
.ev-pitch{background:#EDF4F1;--ev-accent:#6F9588}
.ev-gym{background:#EEF0F5;--ev-accent:#7C879D}
.ev-match{background:#FAF4E6;--ev-accent:#AD9057;cursor:default}
.ev-ic.vid{color:var(--color-primary-text)}
.ev-ic.needed{color:var(--c-partial)}
.ev-ic.ev-flag{cursor:pointer}
.wc-now{position:absolute;left:0;right:0;height:2px;background:var(--c-now);z-index:6}
.wc-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--c-now)}
.tbi{width:36px;height:36px;border-radius:var(--r-md);border:0;background:none;color:var(--color-text-soft);display:grid;place-items:center;cursor:pointer;position:relative}
.tbi:hover{background:var(--color-surface-subtle);color:var(--color-text)}
.tbi svg{width:19px;height:19px}
.tbi .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--color-primary);border:1.5px solid var(--color-surface)}

/* date popup */
.datewrap{position:relative}
.datepop{position:absolute;top:46px;right:0;width:272px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);padding:14px;z-index:50;display:none}
.datepop.open{display:block}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dp-my{font-size:14px;font-weight:700}
.dp-nav{display:flex;gap:4px}
.dp-arrow{width:28px;height:28px;border:0;background:none;border-radius:var(--r-sm);display:grid;place-items:center;cursor:pointer;color:var(--color-text-soft)}
.dp-arrow:hover{background:var(--color-surface-muted);color:var(--color-text)}
.dp-arrow svg{width:16px;height:16px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-dow{font-size:10px;font-weight:600;color:var(--color-text-disabled);text-align:center;padding:4px 0;text-transform:uppercase}
.dp-cell{aspect-ratio:1;border:0;background:none;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;color:var(--color-text);cursor:pointer;display:grid;place-items:center;position:relative;font-family:inherit;font-variant-numeric:tabular-nums}
.dp-cell:hover{background:var(--color-surface-muted)}
.dp-cell.dim{color:var(--color-text-disabled)}
.dp-cell.inwk{background:var(--color-primary-soft)}
.dp-cell.today::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--c-plan)}
.dp-today{margin-top:10px;width:100%;border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--r-md);font-size:12.5px;font-weight:600;color:var(--color-text-soft);height:32px;cursor:pointer}
.dp-today:hover{background:var(--color-surface-subtle);color:var(--color-text)}

/* ---------- right rail ---------- */
.rail-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rail-title{font-size:21px;font-weight:700;letter-spacing:-.01em}
.rail-count{background:var(--color-surface-muted);color:var(--color-text);font-size:12.5px;font-weight:700;border-radius:var(--r-pill);padding:2px 10px}
.rail-sub{font-size:13px;color:var(--color-text-soft);margin-top:6px}
.rtabs{display:flex;gap:26px;border-bottom:1px solid var(--color-separator);margin:18px 0 18px}
.rtab{display:flex;align-items:center;gap:7px;padding:0 0 11px;font-size:13.5px;font-weight:600;color:var(--color-text-soft);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.rtab:hover{color:var(--color-text)}
.rtab.active{color:var(--color-text);border-bottom-color:var(--color-primary)}
.rtab .c{background:var(--color-surface-muted);color:var(--color-text-soft);font-size:11px;font-weight:700;border-radius:var(--r-pill);padding:1px 7px}
.rtab.active .c{background:var(--color-primary-tint);color:var(--color-primary-text)}

/* ============ TODAY'S AGENDA ============ */
function renderToday(){
  const list=evFor(TODAY);
  let done=0,up=0,nextItem=null,earliest=1e9;
  const info=list.map((s)=>{const [a,e]=parseT(s.t);return {s,a,e,isDone:e<=NOW_MIN};});
  info.forEach(o=>{ if(o.isDone){done++;} else {up++; if(o.a<earliest){earliest=o.a;nextItem=o;}} });
  // Order: chronological by start time (calendar order), regardless of done/upcoming.
  const order=info.slice().sort((x,y)=>(x.a-y.a));
  const cards=order.map((o)=>{
    const s=o.s, isNext=(o===nextItem), parts=s.t.split('–');
    const badge=o.isDone
      ? '<span class="ac-badge done">'+CHECKCIRCLE_SVG+'</span>'
      : (isNext ? '<span class="ac-badge next"><span class="ac-dot"></span>Up next</span>'
                : '');
    const pill=o.isDone
      ? (s.title==='Strength' ? '' : '<span class="ac-pill vid">'+VIDEO_SVG+'Video processing</span>')
      : (s.status==='needed'?'<span class="ac-pill needed">'+ALERT_SVG+'Plan needed</span>':'');
    const link=o.isDone?'View session':'View plan';
    const planMode = !o.isDone && s.type==='gym';
    const _pt = s.t.split('–').map(x=>x.trim());
    const cardHref = planMode ? '#' : (s.type==='gym' ? GYM_HREF+'?session='+encodeURIComponent(s.title) : hrefFor(s.type));
    const cardAttrs = planMode ? ` data-plan="1" data-name="${s.title}" data-start="${_pt[0]}" data-end="${_pt[1]}"` : '';
    return `<a class="acard${isNext?' next':''}" href="${cardHref}"${cardAttrs}>
      <div class="ac-top"><span class="ac-type">${typeIcon(s.type)}${typeLabel(s.type)}</span>${badge}</div>
      <div class="ac-body"><div class="ac-title">${s.title}</div><div class="ac-loc">${PIN_SVG}Bodymoor Heath Training Ground</div><div class="ac-time">${CLOCK_SVG}${parts[0].trim()} <span class="dash">–</span> ${parts[1].trim()}</div></div>
      ${(o.isDone&&pill)?`<div class="ac-foot end">${pill}</div>`:`<div class="ac-foot">${pill||'<span></span>'}<span class="ac-link">${link} <i data-lucide="arrow-right"></i></span></div>`}
    </a>`;
  }).join('');
  const wrap=document.getElementById('todayGrid');
  // Show all cards at once (grid sized to the number of sessions). Carousel to come later.
  wrap.innerHTML=`<div class="today-grid" style="--cols:${Math.max(info.length,1)}">${cards}</div>`;
}
function tcInit(){
  const track=document.getElementById('todayTrack'); if(!track) return;
  const n=track.children.length;
  function upd(){
    tcIndex=Math.max(0,Math.min(tcIndex,n-1));
    track.style.transform='translateX(-'+(tcIndex*100)+'%)';
    document.querySelectorAll('#tcDots .tc-dot').forEach((d,i)=>d.classList.toggle('active',i===tcIndex));
    document.getElementById('tcPrev').disabled=tcIndex<=0;
    document.getElementById('tcNext').disabled=tcIndex>=n-1;
  }
  document.getElementById('tcPrev').onclick=()=>{tcIndex--;upd();};
  document.getElementById('tcNext').onclick=()=>{tcIndex++;upd();};
  document.getElementById('tcDots').onclick=e=>{const d=e.target.closest('.tc-dot'); if(!d)return; tcIndex=+d.dataset.i; upd();};
  upd();
}

/* ============ THIS WEEK ============ */
function fmtRange(mon){
  const sun=addDays(mon,6), y=sun.getFullYear();
  const mLong=mon.toLocaleString('en-GB',{month:'long'}), sLong=sun.toLocaleString('en-GB',{month:'long'});
  if(mon.getMonth()===sun.getMonth()) return `${mon.getDate()} – ${sun.getDate()} ${sLong} ${y}`;
  return `${mon.getDate()} ${mon.toLocaleString('en-GB',{month:'short'})} – ${sun.getDate()} ${sLong} ${y}`;
}
function evPast(date,endMin){ const td=new Date(TODAY); td.setHours(0,0,0,0); const dd=new Date(date); dd.setHours(0,0,0,0); if(dd<td) return true; if(dd.getTime()===td.getTime() && endMin<=NOW_MIN) return true; return false; }
function renderWeek(){
  const thisWeek=sameDay(baseMon,mondayOf(TODAY));
  let total=0,pitch=0,gym=0,match=0;
  for(let i=0;i<7;i++){ evFor(addDays(baseMon,i)).forEach(s=>{total++;if(s.type==='pitch')pitch++;else if(s.type==='gym')gym++;else if(s.type==='match')match++;}); }
  document.getElementById('cnt-all').textContent='('+total+')';
  document.getElementById('cnt-pitch').textContent='('+pitch+')';
  document.getElementById('cnt-gym').textContent='('+gym+')';
  document.getElementById('cnt-match').textContent='('+match+')';
  let head='<div></div>';
  for(let i=0;i<7;i++){
    const date=addDays(baseMon,i), isToday=sameDay(date,TODAY), isRest=isRestDay(date);
    const adev = isRest ? `<div class="wc-adev"><i data-lucide="bed"></i>Rest day</div>` : '';
    head+=`<div class="wc-dayh${isRest?' hasadev':''}"><span class="wc-dow">${DOW[i]}</span><span class="wc-date${isToday?' today':''}">${date.getDate()}</span>${adev}</div>`;
  }
  let gut='';
  for(let h=9;h<=17;h++){ gut+=`<div class="wc-hr" style="top:${yFor(h*60)+2}px">${String(h).padStart(2,'0')}:00</div>`; }
  let cols='';
  for(let i=0;i<7;i++){
    const date=addDays(baseMon,i), isToday=sameDay(date,TODAY);
    let evs='';
    evFor(date).filter(s=>wkFilter==='all'||s.type===wkFilter).forEach(s=>{
      const GBOT=17*60; const [a,e]=parseT(s.t);
      const top=yFor(Math.min(a,GBOT-24)); // clamp late events (e.g. an evening match) into the grid
      const hgt=Math.min(Math.max((e-a)/60*HOURPX,30), yFor(GBOT)-top+6);
      const cls=s.type==='gym'?'ev-gym':(s.type==='match'?'ev-match':'ev-pitch');
      const _iso=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
      const tag=s.type==='match'?'div':'a', href=s.type==='match'?'':(s.type==='gym'?` href="${GYM_HREF}?session=${encodeURIComponent(s.title)}&date=${_iso}"`:` href="${hrefFor(s.type)}"`);
      let ic=''; if(s.vid) ic='<span class="ev-ic vid">'+VIDEO_SVG+'</span>'; else if(s.status==='needed') ic='<span class="ev-ic needed'+(s.planFlag?' ev-flag':'')+'">'+ALERT_SVG+'</span>';
      evs+=`<${tag} class="wc-ev ${cls}${evPast(date,e)?' past':''}"${href} style="top:${top}px;height:${hgt}px">`
        +`<div class="ev-title">${s.title}</div><div class="ev-time">${s.t}</div><div class="ev-loc">${s.loc}</div>${ic}</${tag}>`;
    });
    const now=(thisWeek&&isToday)?`<div class="wc-now" style="top:${yFor(NOW_MIN)}px"></div>`:'';
    cols+=`<div class="wc-day${isToday?' today':''}${isRestDay(date)?' rest':''}">${evs}${now}</div>`;
  }
  document.getElementById('weekgrid').innerHTML=
    `<div class="wc-head wc-row">${head}</div>`
    +`<div class="wc-body"><div class="wc-gutter">${gut}</div>${cols}</div>`;
  icons();
}

/* ============ DATE POPUP ============ */
function renderPop(){
  const pop=document.getElementById('datePop');
  const first=new Date(popY,popM,1);
  const start=mondayOf(first);
  const monLabel=first.toLocaleString('en-GB',{month:'long',year:'numeric'});
  const wkStart=baseMon, wkEnd=addDays(baseMon,6);
  let cells='';
  ['M','T','W','T','F','S','S'].forEach(d=>cells+=`<div class="dp-dow">${d}</div>`);
  for(let k=0;k<42;k++){
    const d=addDays(start,k);
    const dim=d.getMonth()!==popM?' dim':'';
    const today=sameDay(d,TODAY)?' today':'';
    const inwk=(d>=wkStart&&d<=wkEnd)?' inwk':'';
    cells+=`<button class="dp-cell${dim}${today}${inwk}" data-t="${d.getTime()}">${d.getDate()}</button>`;
  }
  pop.innerHTML=`<div class="dp-head"><span class="dp-my">${monLabel}</span><div class="dp-nav">
      <button class="dp-arrow" id="dpPrev" aria-label="Previous month"><i data-lucide="chevron-left"></i></button>
      <button class="dp-arrow" id="dpNext" aria-label="Next month"><i data-lucide="chevron-right"></i></button>
    </div></div>
    <div class="dp-grid">${cells}</div>
    <button class="dp-today" id="dpToday">Jump to today</button>`;
  icons();
  pop.querySelector('#dpPrev').onclick=e=>{e.stopPropagation();popM--;if(popM<0){popM=11;popY--;}renderPop();};
  pop.querySelector('#dpNext').onclick=e=>{e.stopPropagation();popM++;if(popM>11){popM=0;popY++;}renderPop();};
  pop.querySelector('#dpToday').onclick=e=>{e.stopPropagation();baseMon=mondayOf(TODAY);renderWeek();closePop();};
  pop.querySelectorAll('.dp-cell').forEach(c=>c.onclick=e=>{
    e.stopPropagation();
    baseMon=mondayOf(new Date(parseInt(c.dataset.t,10)));
    renderWeek();closePop();
  });
}

function openSessionPlan(sess){

}

(function(){

  box.innerHTML='<i data-lucide="search"></i><input type="text" placeholder="Search players" aria-label="Search players"><div class="topsearch-results" id="tsResults"></div>';

  var input=box.querySelector('input'), res=box.querySelector('#tsResults');
  function matches(q){ q=(q||'').trim().toLowerCase(); return SP.filter(function(p){ return !q || ('player '+pad(p.num)).indexOf(q)>=0 || String(p.num).indexOf(q)>=0 || p.pos.toLowerCase().indexOf(q)>=0; }); }
