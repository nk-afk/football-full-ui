<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian · Needs review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --color-primary:#2B7FFF; --color-primary-text:#027BFC; --color-primary-hover:#1C6EF0;
  --color-primary-soft:#EBF3FF; --color-primary-tint:#EBF3FF; --color-primary-border:#B4D1FF; --color-primary-ink:#027BFC;
  --color-page:#F6F8FA; --color-surface:#FFFFFF; --color-surface-subtle:#F9FAFB; --color-surface-muted:#F1F5F9;
  --color-border:#E5E7EB; --color-border-subtle:#EEF2F6; --color-separator:#E6EAF0;
  --color-text:#111827; --color-text-muted:#4B5563; --color-text-soft:#6B7280; --color-text-disabled:#9CA3AF;
  --r-sm:6px; --r-md:10px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  --shadow-card:0 1px 2px rgba(15,23,42,.04); --shadow-pop:0 16px 40px rgba(15,23,42,.18);
  --ff:"Inter Display","Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --side:240px; --top:52px;
  --c-review:#E50C00; --c-review-soft:#FFE7E5;
}
*{margin:0;padding:0;box-sizing:border-box;corner-shape:squircle}
.avatar,.rv-ava{corner-shape:round}
body{font-family:var(--ff);background:var(--color-page);color:var(--color-text);-webkit-font-smoothing:antialiased}
.eyebrow{font-size:11px;line-height:14px;font-weight:400;letter-spacing:.09em;text-transform:uppercase;color:var(--color-text-soft)}
a{color:inherit;text-decoration:none}
button{font-family:var(--ff)}

/* ---------- app shell ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--color-surface);border-bottom:1px solid var(--color-separator);display:flex;align-items:center;gap:14px;padding:0 24px 0 20px;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.02em}
.brandlogo{height:22px;width:auto;display:block;color:var(--color-text)}
.topbar .sp{flex:1}
.topclub{color:var(--color-text-soft);font-weight:600;font-size:13px;padding-right:14px;margin-right:2px;border-right:1px solid var(--color-separator)}
.btn{font-size:13px;font-weight:600;border-radius:var(--r-lg);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.btn:hover{background:var(--color-surface-subtle)}
.btn svg{width:16px;height:16px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.navtoggle{width:34px;height:34px;border-radius:var(--r-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-soft);display:grid;place-items:center;cursor:pointer;flex:none}
.navtoggle:hover{background:var(--color-surface-subtle);color:var(--color-text)}
.navtoggle svg{width:18px;height:18px}
.side{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);background:var(--color-surface);border-right:1px solid var(--color-separator);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto;z-index:30;transition:width .2s ease}
.side .grp{margin:14px 8px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);border:1px solid transparent;color:var(--color-text-soft);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;position:relative}
.nav svg{width:18px;height:18px;color:var(--color-text-soft)}
.nav:hover{background:var(--color-surface-subtle)}
.nav.disabled{cursor:default;pointer-events:none}
.nav.active{background:var(--color-surface-muted);border-color:rgba(31,43,39,.03);color:var(--color-text);font-weight:600}
.nav.active svg{color:var(--color-text)}
.nav .badge{margin-left:auto;background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;border-radius:var(--r-pill);padding:1px 8px}
.side-foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.sidecta{width:100%;justify-content:center;background:var(--color-primary-tint);border-color:var(--color-primary-text);color:var(--color-primary-text);font-weight:700}
.sidecta:hover{background:#DCEAFF}
.profile{display:flex;align-items:center;gap:10px;padding:2px}
.profile .pname{font-size:13px;font-weight:600;color:var(--color-text)}
body.nav-collapsed{--side:64px}
body.nav-collapsed .side{padding:16px 8px}
body.nav-collapsed .side .grp{display:none}
body.nav-collapsed .nav{justify-content:center;padding:9px 0;gap:0}
body.nav-collapsed .nav .lbl{display:none}
body.nav-collapsed .nav .badge{position:absolute;top:1px;right:9px;margin:0}
body.nav-collapsed .side-foot{align-items:center}
body.nav-collapsed .sidecta{width:36px;padding:0}
body.nav-collapsed .sidecta .lbl{display:none}
body.nav-collapsed .profile .pname{display:none}
.main{margin-left:var(--side);margin-top:var(--top);transition:margin-left .2s ease;padding-bottom:70px}

/* ---------- page ---------- */
.va-wrap{max-width:1420px;margin:0 auto;padding:22px 28px 0}
.va-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--color-text-soft);margin-bottom:10px}
.va-back:hover{color:var(--color-primary-text)}
.va-back svg{width:16px;height:16px}
.rail-head{display:flex;align-items:center;gap:10px}
.rail-title{font-size:28px;font-weight:700;letter-spacing:-.01em}
.rail-count{background:var(--color-surface-muted);color:var(--color-text);font-size:13px;font-weight:700;border-radius:var(--r-pill);padding:2px 11px}
.rail-sub{font-size:13px;color:var(--color-text-soft);margin-top:6px}
.rtabs{display:flex;gap:26px;border-bottom:1px solid var(--color-separator);margin:18px 0 18px}
.rtab{display:flex;align-items:center;gap:7px;padding:0 0 11px;font-size:13.5px;font-weight:600;color:var(--color-text-soft);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.rtab:hover{color:var(--color-text)}
.rtab.active{color:var(--color-text);border-bottom-color:var(--color-primary)}
.rtab .c{background:var(--color-surface-muted);color:var(--color-text-soft);font-size:11px;font-weight:700;border-radius:var(--r-pill);padding:1px 7px}
.rtab.active .c{background:var(--color-primary-tint);color:var(--color-primary-text)}

#reviewList{display:flex;flex-direction:column;gap:16px}
.revcard{background:var(--color-surface);border:none;border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-card);margin-bottom:6px}
.rv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.rv-phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rv-pnum{width:34px;height:34px;border-radius:50%;corner-shape:round;background:var(--color-surface-muted);color:var(--color-text);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none;overflow:hidden}
.rv-pnum img{width:100%;height:100%;object-fit:cover;display:block}
.rv-pname{font-size:15.5px;font-weight:700}
.rv-tpill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--color-text-soft);background:var(--color-surface-subtle);border-radius:var(--r-pill);padding:4px 11px}
.rv-tpill svg{width:14px;height:14px}
.rv-pctx{font-size:13px;color:var(--color-text-soft)}
.rv-badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--c-review);background:var(--c-review-soft);border-radius:var(--r-pill);padding:4px 12px}
.rv-badge svg{width:15px;height:15px}
.rv-cols{display:grid;grid-template-columns:300px minmax(0,1fr) 270px;gap:28px;align-items:start}
.rv-video{position:relative;aspect-ratio:16/10;border-radius:var(--r-md);overflow:hidden;background:var(--color-surface-muted);cursor:pointer}
.rv-video img,.rv-video video{width:100%;height:100%;object-fit:cover;display:block}
.rv-video.playing .rv-play{display:none}
.rv-vlabel{position:absolute;top:8px;left:8px;background:rgba(17,24,39,.72);color:#fff;font-size:11px;font-weight:600;border-radius:5px;padding:2px 7px}
.rv-play{position:absolute;inset:0;margin:auto;width:44px;height:44px;border-radius:50%;corner-shape:round;background:rgba(17,24,39,.55);color:#fff;border:0;display:grid;place-items:center;cursor:pointer}
.rv-play svg{width:26px;height:26px;margin-left:3px}
.rv-play svg path{stroke:currentColor;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.rv-scrub{margin-top:12px}
.rv-track{position:relative;height:4px;border-radius:2px;background:var(--color-border);margin:6px 3px 0}
.rv-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;background:var(--color-primary);border:2px solid var(--color-surface)}
.rv-scrub-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-top:9px;font-size:12px}
.rv-sl b{display:block;font-size:12.5px;font-weight:700;color:var(--color-text)}
.rv-sl span{color:var(--color-text-soft)}
.rv-sl.rt{text-align:right}
.rv-sc{color:var(--color-text-soft);text-align:center;white-space:nowrap}
.rv-mtitle{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-bottom:14px}
.rv-mid .rv-meta{display:flex;flex-direction:column;gap:11px}
.rv-row{display:flex;gap:14px;font-size:13.5px;line-height:1.35}
.rv-row .k{color:var(--color-text-soft);width:84px;flex:none}
.rv-row .v{font-weight:600;color:var(--color-text)}
.rv-ev-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-soft);font-weight:600;margin:16px 0 7px;padding-top:15px;border-top:1px solid var(--color-separator)}
.rv-ev{font-size:13.5px;color:var(--color-text-muted);line-height:1.5}
.rv-dn-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-soft);font-weight:600;margin-bottom:8px}
.rv-dn{font-size:16px;font-weight:700;line-height:1.3;color:var(--color-text);margin-bottom:16px}
.rv-review{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;font-size:14px;font-weight:700;color:var(--color-primary-text);background:var(--color-primary-tint);border:1px solid var(--color-primary-text);border-radius:var(--r-lg);padding:10px 14px;cursor:pointer;font-family:inherit}
.rv-review:hover{background:#DCEAFF}
.rv-review svg{width:17px;height:17px}
.rv-actions{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:14px}
.rv-act{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--color-primary-text);background:none;border:0;padding:0;cursor:pointer;font-family:inherit;justify-self:center}
.rv-act svg{width:16px;height:16px}
.rv-act:hover{color:var(--color-primary-hover)}
.rv-asep{width:1px;height:16px;background:var(--color-border)}
.rempty{font-size:13px;color:var(--color-text-soft);padding:20px 2px}
@media(max-width:1080px){.rv-cols{grid-template-columns:1fr;gap:20px}}
.closing{font-size:12.5px;color:var(--color-text-disabled);margin-top:18px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;font-size:13px;font-weight:500;border-radius:var(--r-md);padding:11px 16px;box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:920px){:root{--side:0px}.side{display:none}.va-wrap{padding:22px 20px}}
@media(max-width:1080px){.revcard{grid-template-columns:1fr}}
@media(max-width:560px){.rv-frames{grid-template-columns:1fr}}
.modal-scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:62}
.modal-scrim.open{opacity:1;pointer-events:auto}
.planmodal{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%);width:560px;max-width:94vw;max-height:90vh;overflow:auto;background:var(--color-surface);border-radius:var(--r-xl);box-shadow:var(--shadow-pop);z-index:63;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.planmodal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.pm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 24px 0}
.pm-title{font-size:19px;font-weight:700;letter-spacing:-.01em}
.pm-sub{font-size:13px;color:var(--color-text-soft);margin-top:3px}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 24px 24px}
.pm-card{display:flex;gap:13px;align-items:flex-start;text-align:left;border:1px solid var(--color-border);border-radius:var(--r-lg);padding:15px;background:var(--color-surface);cursor:pointer;font-family:inherit}
.pm-card:hover{border-color:var(--color-primary-border);background:var(--color-primary-tint)}
.pm-ic{width:38px;height:38px;border-radius:var(--r-md);background:var(--color-primary-tint);color:var(--color-primary-text);display:grid;place-items:center;flex:none}
.pm-card:hover .pm-ic{background:var(--color-surface)}
.pm-ic svg{width:19px;height:19px}
.pm-ct{display:flex;flex-direction:column;min-width:0}
.pm-cl{font-size:14px;font-weight:600;color:var(--color-text)}
.pm-cd{font-size:12.5px;color:var(--color-text-soft);margin-top:3px;line-height:1.4}
.pm-close{margin-left:auto;width:32px;height:32px;border:1px solid var(--color-border);background:none;border-radius:var(--r-md);cursor:pointer;display:grid;place-items:center;color:var(--color-text-soft)}
.pm-close:hover{background:var(--color-surface-subtle);color:var(--color-text)}
.pm-close svg{width:16px;height:16px}
@media(max-width:560px){.pm-grid{grid-template-columns:1fr}}
</style>
<style>
/* ======================== NAV BAR GRADIENT ======================== */
.side{background:linear-gradient(180deg,#090C34 0%,#0F3167 100%);border-right:1px solid rgba(255,255,255,.08)}
.side .grp{color:rgba(255,255,255,.42)}
.nav{color:rgba(255,255,255,.72)}
.nav svg{color:rgba(255,255,255,.72)}
.nav:hover{background:rgba(255,255,255,.08);color:#fff}
.nav:hover svg{color:#fff}
.nav.active{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.16);color:#fff}
.nav.active svg{color:#fff}
.sidecta{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.sidecta:hover{background:rgba(255,255,255,.2)}
.sidecta svg{color:#fff}
.profile .pname{color:#fff}
</style>
<style>
/* ======================== GLASS CARDS ======================== */
.pcard,.tile,.statcard,.statstrip,.ovstrip,.dcard,.pb-card,.panel,.exlb-card,.acard,.revcard,.weekcal,.pd-card,.ptable{
  background:rgba(255,255,255,.4);
  border:2px solid #FFFFFF;
  border-radius:24px;
  box-shadow:none;
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
}
</style>
<style>
/* ======================== MD DESIGN BASIS (payment-options spec) ======================== */
/* Blue accent / primary palette (fonts untouched) */
:root{
  --color-primary:#1C3FCA;
  --color-primary-hover:#022198;
  --color-primary-active:#022198;
  --color-primary-text:#004A8E;
  --color-primary-ink:#004A8E;
  --color-primary-soft:#DDE9FF;
  --color-primary-tint:#DDE9FF;
  --color-primary-border:#A3BAF9;
}
/* Light lavender-blue patterned page background */
body{
  background:
    repeating-radial-gradient(circle at 50% -8%, rgba(255,255,255,.26) 0 1px, transparent 1px 66px),
    linear-gradient(135deg,#EFF6FF 0%,#E6EDFF 52%,#FAF5FF 100%);
  background-attachment:fixed;
  background-color:#E9EEFF;
}
.main{background:transparent}
</style>
<style>
/* ======================== BRAND INTO NAV ======================== */
/* Navy top-left corner (matches the sidebar width) so the meridian logo sits on the blue */
.topbar{background:linear-gradient(90deg,#090C34 0,#090C34 var(--side),var(--color-surface) var(--side));border-bottom:0}
.brandlogo,.brand .mark{color:#fff}
.navtoggle{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.navtoggle:hover{background:rgba(255,255,255,.22);color:#fff}
body.nav-collapsed .brandlogo{display:none}
</style>
<style>
/* ======================== GLASS BARS (topbar + weekstrip) ======================== */
.topbar{background:linear-gradient(90deg,#090C34 0,#090C34 var(--side),rgba(255,255,255,.4) var(--side));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.weekstrip{background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
</style>
<style>
/* ======================== CARD STROKE (soft glass edge) ======================== */
.pcard,.tile,.statcard,.statstrip,.ovstrip,.dcard,.pb-card,.panel,.exlb-card,.acard,.revcard,.weekcal,.pd-card,.ptable{
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 12px 32px rgba(16,24,40,.07), 0 2px 6px rgba(16,24,40,.04), inset 0 1px 0 rgba(255,255,255,.95);
}
</style>
<style>
/* ======================== INTERNAL CARDS (glass tiles) ======================== */
.clipcard,.kmcard,.flagcard{
  background:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.52));
  border:1px solid rgba(255,255,255,.85);
  border-radius:20px;
  box-shadow:0 8px 20px rgba(16,24,40,.06), inset 0 1px 0 rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
</style>
<style>
/* ======================== DATA TABLE: no card fill (rows transparent) ======================== */
.ptable{background:transparent;border:0;border-radius:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.ptable td,.ptable th,.ptable tr{background:transparent}
</style>
<style>
/* ======================== SECTION DIVIDER (topbar / weekstrip) ======================== */
.weekstrip{position:relative}
.weekstrip::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(16,24,40,.15) 14%,rgba(16,24,40,.15) 86%,transparent);pointer-events:none}
</style>
<style>
/* ======================== INTERNAL CARDS v2 + NAV LINE FIX ======================== */
/* Internal cards per spec: 40% white fill, 2px white inside stroke, radius 16 */
.clipcard,.kmcard,.flagcard{
  background:rgba(255,255,255,.4);
  border:2px solid #FFFFFF;
  border-radius:16px;
  box-shadow:none;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
/* Remove the hairline on the nav rail */
.side{border-right:0}
</style>
<style>
/* ======================== INTERNAL CARD: translucent (not stacked white) ======================== */
.clipcard,.kmcard,.flagcard{background:transparent}
</style>
<style>
/* ======================== NAV LEFT EDGE FIX ======================== */
body::before{content:"";position:fixed;left:0;top:0;bottom:0;width:3px;background:#090C34;z-index:45;pointer-events:none}
</style>
<style>
/* ======================== INTERNAL CARD DROP SHADOW ======================== */
.clipcard,.kmcard,.flagcard{box-shadow:10px 10px 15px -3px rgba(16,24,40,.10)}
</style>
<style>
/* ======================== PARTIAL → amber badge grading (Container.svg) ======================== */
:root{
  --c-partial:#F99F35;
  --c-partial-ink:#D67D26;
  --c-partial-soft:#FFF7ED;
}
.exc.p{border:1px solid #FDD185}
.rv2-pill,.rv2-issue.is-partial .rv2-issue-ic{border:1px solid #FDD185}
</style>
<style>
/* ======================== PRIMARY BUTTON (Button.svg) ======================== */
.btn.primary{
  background:
    radial-gradient(130% 130% at 12% 0%, rgba(255,255,255,.30), rgba(255,255,255,0) 55%),
    linear-gradient(100deg, #0F3167 0%, #022198 60%);
  border:0;
  border-radius:20px;
  color:#fff;
  box-shadow:10px 10px 24px -3px rgba(51,94,179,.40), inset 0 0 0 2px rgba(255,255,255,.20);
}
.btn.primary:hover{
  background:
    radial-gradient(130% 130% at 12% 0%, rgba(255,255,255,.38), rgba(255,255,255,0) 55%),
    linear-gradient(100deg, #15397a 0%, #04289c 60%);
}
.btn.primary svg{color:#fff}
</style>
<style>
/* ======================== NAV SEAM + CLIPCARD16 + BUTTON v2 ======================== */
/* kill the bright seam where the navy rail meets the light content */
.side{box-shadow:inset -2px 0 0 0 #0C1240, 4px 0 12px -4px rgba(9,12,52,.22)}
/* internal card padding 16 */
.clipcard{padding:16px}
/* primary button per new Button.svg: solid #022198 + radial sheen + 2px white inner stroke, NO drop shadow */
.btn.primary{
  background:radial-gradient(130% 130% at 8% -5%, rgba(255,255,255,.30), rgba(255,255,255,0) 55%), #022198;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.20);
}
.btn.primary:hover{
  background:radial-gradient(130% 130% at 8% -5%, rgba(255,255,255,.38), rgba(255,255,255,0) 55%), #04289C;
}
</style>
<style>
/* ======================== HL-CTA button fill/text ======================== */

<body>

<main class="main">

<div class="toast" id="toast"></div>

<script>

const GYM_SVG='<svg viewBox="0 0 256 256" fill="currentColor"><path d="M248,120h-8V88a16,16,0,0,0-16-16H208V64a16,16,0,0,0-16-16H168a16,16,0,0,0-16,16v56H104V64A16,16,0,0,0,88,48H64A16,16,0,0,0,48,64v8H32A16,16,0,0,0,16,88v32H8a8,8,0,0,0,0,16h8v32a16,16,0,0,0,16,16H48v8a16,16,0,0,0,16,16H88a16,16,0,0,0,16-16V136h48v56a16,16,0,0,0,16,16h24a16,16,0,0,0,16-16v-8h16a16,16,0,0,0,16-16V136h8a8,8,0,0,0,0-16ZM32,168V88H48v80Zm56,24H64V64H88V192Zm104,0H168V64h24V175.82c0,.06,0,.12,0,.18s0,.12,0,.18V192Zm32-24H208V88h16Z"/></svg>';
const CHECK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  18:['poster_03_squat.jpg','player03_squat_set1_000.0s-028.3s_6reps.mp4'],
  4 :['poster_01_seated_row.jpg','player01_seated_row_set1_023.1s-042.1s_12reps.mp4'],
  22:['poster_20_leg_curl.jpg','player20_leg_curl_set1_164.7s-167.9s_3reps.mp4'],
  9 :['poster_20_leg_curl.jpg','player20_leg_curl_set1_164.7s-167.9s_3reps.mp4'],

};
let rvFilter='all';
const decided=new Set();
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);}

function metaRows(m){return m.map(x=>`<div class="rv-row"><span class="k">${x[0]}</span><span class="v">${x[1]}</span></div>`).join('');}
function frameFig(num,f,idx){
  return `<figure class="rv-fig">
    <div class="rv-img"><img src="https://picsum.photos/seed/mfr${num}${idx}/360/230" alt=""></div>
    <figcaption class="rv-cap"><b>${f[0]}</b><span>Frame at ${f[1]} · clip window ${f[2]}</span></figcaption>
  </figure>`;
}
function revCardHTML(r){
  const title=r.title||r.ctx, badge=r.badge||'Context missing';
  const med=MEDIA[r.num];
  const poster=med?CLIPDIR+med[0]:(r.poster||'clips/placeholder_thumb.jpg');
  const clip=med?CLIPDIR+med[1]:'';
  const media= clip
    ? `<video poster="${poster}" preload="metadata" muted loop playsinline><source src="${clip}" type="video/mp4"></video>`
    : `<img src="${poster}" alt="">`;
  const meta=r.meta.filter(x=>x[0]!=='Clip window'&&x[0]!=='Compared');
  const f0=r.frames[0], f1=r.frames[1];
  return `<div class="revcard" data-num="${r.num}">
    <div class="rv-top">
      <div class="rv-phead">
        <div class="rv-pnum"><img src="https://randomuser.me/api/portraits/men/${r.num}.jpg" alt="" loading="lazy"></div>
        <div class="rv-pname">Player ${r.num}</div>
        <span class="rv-tpill">${typeIcon(r.type)}${typeLabel(r.type)}</span>
        <span class="rv-pctx">${r.when} · ${r.ctx}</span>
      </div>
      <span class="rv-badge">${ALERT_SVG}${badge}</span>
    </div>
    <div class="rv-cols">
      <div class="rv-left">
        <div class="rv-video">
          ${media}
          <button class="rv-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        </div>
        <div class="rv-scrub">
          <div class="rv-track"><span class="rv-dot" style="left:32%"></span><span class="rv-dot" style="left:64%"></span></div>
          <div class="rv-scrub-row">
            <div class="rv-sl"><b>${f0[0]}</b><span>${f0[1]}</span></div>
            <div class="rv-sc">Clip ${f0[2]}</div>
            <div class="rv-sl rt"><b>${f1[0]}</b><span>${f1[1]}</span></div>
          </div>
        </div>
      </div>
      <div class="rv-mid">
        <div class="rv-mtitle">${title}</div>
        <div class="rv-meta">${metaRows(meta)}</div>
        <div class="rv-ev-label">Evidence</div>
        <div class="rv-ev">${r.shows}</div>
      </div>
      <div class="rv-right">
        <div class="rv-dn-label">Decision needed</div>
        <div class="rv-dn">${r.coach}</div>
        <button class="rv-review" data-v="Review"><i data-lucide="play"></i>Review clip</button>
        <div class="rv-actions">
          <button class="rv-act" data-v="Modify"><i data-lucide="pencil"></i>Modify</button>
          <span class="rv-asep"></span>
          <button class="rv-act" data-v="Dismiss"><i data-lucide="x"></i>Dismiss</button>
        </div>
      </div>
    </div>
  </div>`;
}
function undecided(){return REVIEW.filter(r=>!decided.has(r.num)&&r.type!=='pitch');}
function renderTabs(){
  const u=undecided();
  const counts={all:u.length,pitch:u.filter(r=>r.type==='pitch').length,gym:u.filter(r=>r.type==='gym').length};
  const defs=[['all','All'],['gym','Gym']];
  document.getElementById('reviewTabs').innerHTML=defs.map(([k,l])=>
    `<div class="rtab${rvFilter===k?' active':''}" data-t="${k}">${l}<span class="c">${counts[k]}</span></div>`).join('');
  const todayN=u.filter(r=>r.when==='Today').length;
  document.getElementById('reviewSub').textContent=`${todayN} today · ${u.length-todayN} from earlier sessions`;
  document.getElementById('reviewCount').textContent=u.length;
  const nb=document.getElementById('navBadge'); if(nb) nb.textContent=u.length;
}
function renderReview(){
  const list=undecided().filter(r=>rvFilter==='all'||r.type===rvFilter);
  const el=document.getElementById('reviewList');
  el.innerHTML= list.length ? list.map(revCardHTML).join('') : '<div class="rempty">Nothing waiting. Every clip has a decision.</div>';
  icons();
}
document.getElementById('reviewTabs').addEventListener('click',e=>{
  const t=e.target.closest('.rtab'); if(!t)return;
  rvFilter=t.dataset.t; renderTabs(); renderReview();
});
document.getElementById('reviewList').addEventListener('click',e=>{
  const vbox=e.target.closest('.rv-video');
  if(vbox){ const v=vbox.querySelector('video'); if(v){ if(v.paused){v.play();vbox.classList.add('playing');} else {v.pause();vbox.classList.remove('playing');} v.onended=()=>vbox.classList.remove('playing'); } return; }
  const b=e.target.closest('.rv-act'); if(!b)return;
  const card=b.closest('.revcard'); const num=parseInt(card.dataset.num,10); const v=b.dataset.v;
  decided.add(num);
  toast('Logged · '+v+' · Player '+num);
  setTimeout(()=>{ renderTabs(); renderReview(); },260);
});
renderTabs(); renderReview(); icons();
(function(){ var b=document.querySelector('.va-back'); if(b) b.addEventListener('click',function(){ try{ sessionStorage.setItem('mh-restore','1'); }catch(e){} }); })();

function renderPlanModal(){ document.getElementById('pmGrid').innerHTML=PLAN_METHODS.map((m,i)=>`<button class="pm-card" data-i="${i}"><span class="pm-ic"><i data-lucide="${m.icon}"></i></span><span class="pm-ct"><span class="pm-cl">${m.label}</span><span class="pm-cd">${m.desc}</span></span></button>`).join(''); icons(); }
function openPlanModal(){ document.getElementById('planScrim').classList.add('open'); document.getElementById('planModal').classList.add('open'); }
function closePlanModal(){ document.getElementById('planScrim').classList.remove('open'); document.getElementById('planModal').classList.remove('open'); }
document.getElementById('planScrim').onclick=closePlanModal;
document.getElementById('planClose').onclick=closePlanModal;
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closePlanModal(); });
document.getElementById('pmGrid').addEventListener('click',function(e){ const c=e.target.closest('.pm-card'); if(!c)return; const m=PLAN_METHODS[+c.dataset.i]; closePlanModal(); pmToast(m.label+' \u00b7 coming soon'); });
document.addEventListener('click',function(e){ if(e.target.closest('.sidecta')) openPlanModal(); });
renderPlanModal();
