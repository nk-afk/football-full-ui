/* ====================== TABS ====================== */
var TABS=[{k:'overview',label:'Overview'},{k:'drills',label:'Drills'},{k:'players',label:'Players'},{k:'review',label:'Review'}];
function renderTabs(){
  var host=document.getElementById('themetabs');
  host.innerHTML=TABS.map(function(t){ var ct=t.ct; return '<button class="ttab'+(t.k===state.tab?' active':'')+'" data-tab="'+t.k+'">'+t.label+(ct?'<span class="tct num">'+ct+'</span>':'')+'</button>'; }).join('');

}
function renderPane(){
  var host=document.getElementById('panes');
  if(state.planOpen){ host.innerHTML=planPane(); }
  else if(state.srcOpen){ host.innerHTML=sourcesPane(); }
  else if(state.tab==='overview'){ host.innerHTML = state.ovSub==='drillload' ? drillLoadPane() : PANE.overview(); }
  else if(state.tab==='drills'){ host.innerHTML = state.drill ? drillDetail(state.drill) : drillsLanding(); }
  else if(state.tab==='players'){ host.innerHTML=playersPane(); }
  else if(state.tab==='review'){ host.innerHTML=PANE.review(); }
  else { host.innerHTML = PANE[state.tab]?PANE[state.tab]():''; }

  var pf=document.getElementById('pgfoot'); if(pf) pf.style.display = (!state.srcOpen && !state.planOpen && rootView) ? '' : 'none';
  var standalone = state.planOpen || state.srcOpen || (state.tab==='overview' && state.ovSub==='drillload') || (state.tab==='drills' && state.drill) || (state.tab==='review' && (state.reviewView==='detail' || state.standaloneReview)) || (state.tab==='players' && (state.pView==='squad' || state.pView==='scanning' || state.pView==='movement' || (state.pView==='player' && state.standalonePlayer)));

  var tbs=document.getElementById('themetabs'); if(tbs) tbs.style.display = standalone ? 'none' : '';

  var bb=document.getElementById('backbar'); if(bb) bb.classList.remove('show');
  window.__navLastY = window.scrollY || 0;
  wirePane(); icons(); maybePushNav(); saveState();
}
/* ---- browser history: two-finger swipe / back-forward navigation ---- */
function navSnapshot(){ return {tab:state.tab,ovSub:state.ovSub,drill:state.drill,pView:state.pView,pPlayer:state.pPlayer,reviewView:state.reviewView,reviewIdx:state.reviewIdx,standaloneReview:state.standaloneReview,standalonePlayer:state.standalonePlayer,srcOpen:state.srcOpen,planOpen:state.planOpen}; }
var lastNavKey=null, navSuppress=false, navDepth=0, navReplace=false;
function maybePushNav(){ if(navSuppress) return; var snap=navSnapshot(), key=JSON.stringify(snap); if(key===lastNavKey) return; try{ if(lastNavKey===null || navReplace){ history.replaceState(snap,''); } else { history.pushState(snap,''); navDepth++; } }catch(e){} navReplace=false; lastNavKey=key; }
function applySnapshot(s){ ['tab','ovSub','drill','pView','pPlayer','reviewView','reviewIdx','standaloneReview','standalonePlayer','srcOpen','planOpen'].forEach(function(k){ state[k]=s[k]; }); renderTabs(); renderPane(); }
window.addEventListener('popstate', function(e){ if(!e.state) return; navSuppress=true; navDepth=Math.max(0,navDepth-1); applySnapshot(e.state); lastNavKey=JSON.stringify(navSnapshot()); navSuppress=false; var __y=(typeof e.state.scrollY==='number')?e.state.scrollY:0; requestAnimationFrame(function(){ window.scrollTo(0,__y); }); });
/* remember scroll position per history entry so Back returns to where you were */
try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(e){}
(function(){ var tk=false; window.addEventListener('scroll', function(){ if(tk)return; tk=true; requestAnimationFrame(function(){ tk=false; try{ var s=history.state; if(s){ s.scrollY=window.scrollY||document.documentElement.scrollTop||0; history.replaceState(s,''); } }catch(e){} }); }, {passive:true}); })();

function drillCards(hideLabel){
  var maxMmin=Math.max.apply(null,DRILLS.map(function(d){return d.mmin;}));
  return '<div class="drillcards">'+DRILLS.map(function(d){
    var pct=Math.round(d.mmin/maxMmin*100);
    return '<button class="dcard" data-drill="'+d.k+'">'
      + '<div class="dtop"><span class="dnum">'+d.n+'</span><span class="ddur"><i data-lucide="clock"></i>'+d.min+' min</span></div>'
      + '<div class="dnm">'+d.name+'</div>'
      + '<div class="dmrow"><span class="dmetric"><span class="dval">'+d.mmin+'</span><span class="dunit">m/min</span></span>'+(d.tag?'<span class="dchip">'+d.tag+'</span>':'')+'</div>'

      + '<div class="dbar"><span class="dbar-track"><span class="dbar-fill" style="width:'+pct+'%"></span></span><span class="dbar-pct">'+pct+'%</span></div>'
      + '<div class="dana"><div class="dana-l">'+(hideLabel?'':'<div class="dal">Analysis available</div>')+'<div class="dav">'+d.cardana+'</div></div><span class="dana-arrow"><i data-lucide="arrow-right"></i></span></div>'

function formation(team,phase){
  var pts=[],pls; if(team==='A'){pls=['01','02','03','05','11','08','12','15','16','19'];}else{pls=['04','06','07','09','10','13','14','17','18','08'];}
  var push=phase==='in'?(team==='A'?16:-16):0;
  function col(x,ys,names){ys.forEach(function(y,i){pts.push({x:x,y:y,lab:names[i]});});}
  if(team==='A'){col(34+push,[22,48,80,106],[pls[0],pls[1],pls[2],pls[3]]);col(70+push,[34,64,94],[pls[4],pls[5],pls[6]]);col(96+push,[30,64,98],[pls[7],pls[8],pls[9]]);}
  else{col(166+push,[22,48,80,106],[pls[0],pls[1],pls[2],pls[3]]);col(130+push,[34,64,94],[pls[4],pls[5],pls[6]]);col(104+push,[30,64,98],[pls[7],pls[8],pls[9]]);}
  return pts;
}

  function dots(team){ var pts=formation(team,phase); var col=team==='A'?'var(--teamA)':'var(--teamB)'; var hull=[pts[0],pts[7],pts[9],pts[3]]; var poly='<polygon class="shape'+(team==='B'?' shapeB':'')+'" points="'+hull.map(function(p){return p.x+','+p.y;}).join(' ')+'"/>'; var d=pts.map(function(p){return '<circle class="pdot" cx="'+p.x+'" cy="'+p.y+'" r="6.5" fill="'+col+'"/><text class="plab" x="'+p.x+'" y="'+p.y+'">'+(+p.lab)+'</text>';}).join(''); return poly+d; }

function backlineChart(){
  var W=320,H=318,pad=22; var A=[20,24,31,27,22,28,25,30,23],B=[22,26,24,28,23,25,27,24,26]; var labs=['0-3','3-6','6-9','9-12','12-15','15-18','18-21','21-24','24-27']; var ymin=10,ymax=35;
  function X(i){return pad+i*((W-pad-6)/(A.length-1));} function Y(v){return (H-18)-(v-ymin)/(ymax-ymin)*(H-18-6);} function path(arr){return arr.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');}
  var grid=''; [15,20,25,30].forEach(function(g){grid+='<line class="grid" x1="'+pad+'" y1="'+Y(g)+'" x2="'+(W-6)+'" y2="'+Y(g)+'"/><text x="2" y="'+(Y(g)+3)+'">'+g+'</text>';});

  var zones=labs.map(function(l,i){var cx=X(i);return '<rect class="lc-zone" x="'+(cx-bw/2).toFixed(1)+'" y="6" width="'+bw.toFixed(1)+'" height="'+(H-24)+'" fill="transparent" data-cx="'+cx.toFixed(1)+'" data-t="'+l+'" data-a="'+A[i]+'" data-b="'+B[i]+'" data-ya="'+Y(A[i]).toFixed(1)+'" data-yb="'+Y(B[i]).toFixed(1)+'"/>';}).join('');

/* standalone back bar: reveal the top-nav-styled Back bar on scroll-up, hide on scroll-down or at the very top (where the plain inline Back button already sits) */
(function(){
  var bb=document.getElementById('backbar');
  if(bb){ bb.onclick=function(){ var ib=document.querySelector('#panes .backlink'); if(ib){ ib.click(); } else { history.back(); } }; }
  window.__navLastY = window.scrollY || 0;
  var TOPZONE=64, ticking=false;
  function update(){
    ticking=false;
    if(!bb) return;
    var y=window.scrollY||document.documentElement.scrollTop||0;
    if(!document.body.classList.contains('standalone')){ bb.classList.remove('show'); window.__navLastY=y; return; }
    if(y<=TOPZONE){ bb.classList.remove('show'); }
    else if(y>window.__navLastY+4){ bb.classList.remove('show'); }
    else if(y<window.__navLastY-4){ bb.classList.add('show'); }
    window.__navLastY=y;
  }
  window.addEventListener('scroll', function(){ if(!ticking){ ticking=true; requestAnimationFrame(update); } }, {passive:true});
})();

  function pmToast(msg){ var t=document.getElementById('m-toast'); if(!t){t=document.createElement('div');t.id='m-toast';t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;font-weight:600;font-size:13px;padding:11px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.25);z-index:9999;opacity:0;transition:opacity .18s;pointer-events:none';document.body.appendChild(t);} t.textContent=msg; requestAnimationFrame(function(){t.style.opacity='1';}); clearTimeout(t._h); t._h=setTimeout(function(){t.style.opacity='0';},2200); }
  function renderPlanModal(){ document.getElementById('pmGrid').innerHTML=PLAN_METHODS.map(function(m,i){return '<button class="pm-card" data-i="'+i+'"><span class="pm-ic"><i data-lucide="'+m.icon+'"></i></span><span class="pm-ct"><span class="pm-cl">'+m.label+'</span><span class="pm-cd">'+m.desc+'</span></span></button>';}).join(''); pmi(); }
  function openPlanModal(){ document.getElementById('planScrim').classList.add('open'); document.getElementById('planModal').classList.add('open'); }
  function closePlanModal(){ document.getElementById('planScrim').classList.remove('open'); document.getElementById('planModal').classList.remove('open'); }
  document.getElementById('planScrim').onclick=closePlanModal;
  document.getElementById('planClose').onclick=closePlanModal;
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closePlanModal(); });
  document.getElementById('pmGrid').addEventListener('click',function(e){ var c=e.target.closest('.pm-card'); if(!c)return; var m=PLAN_METHODS[+c.dataset.i]; closePlanModal(); pmToast(m.label+' · coming soon'); });
  document.addEventListener('click',function(e){ if(e.target.closest('.sidecta')) openPlanModal(); });
  renderPlanModal();
})();
</script>
</body>
</html>
